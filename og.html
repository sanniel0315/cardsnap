<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>CardSnap · OG 分享圖(1200×630)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--teal:#0d9488;--teal2:#14b8a6;--blue:#0ea5e9;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0}
body{font-family:-apple-system,"Segoe UI","Noto Sans TC",system-ui,sans-serif;background:#eef2f5;display:flex;flex-direction:column;align-items:center;gap:18px;padding:30px 16px;color:var(--ink)}
/* 精準 1200×630:截這張存成 assets/og.png */
.og{position:relative;width:1200px;height:630px;overflow:hidden;background:linear-gradient(135deg,#f8fafc,#eef7f6);display:flex;align-items:center;gap:56px;padding:0 84px;flex:none;box-shadow:0 30px 80px -30px rgba(15,23,42,.35)}
.og .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5}
.og .b1{width:520px;height:520px;background:radial-gradient(circle,#5eead4,transparent 70%);top:-160px;left:-120px}
.og .b2{width:480px;height:480px;background:radial-gradient(circle,#7dd3fc,transparent 70%);bottom:-180px;right:-90px}
.og .left{position:relative;z-index:1;flex:1}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:30px}
.brand .mark{width:56px;height:56px;border-radius:15px;background:linear-gradient(135deg,var(--teal2),var(--blue));display:grid;place-items:center;box-shadow:0 12px 26px -8px rgba(14,165,233,.6)}
.brand .mark svg{width:34px;height:34px}
.brand b{font-size:32px;font-weight:800;letter-spacing:-.02em}
.pill{display:inline-flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);color:var(--teal);font-weight:700;font-size:18px;padding:9px 18px;border-radius:999px;margin-bottom:26px;box-shadow:0 6px 16px -8px rgba(13,148,136,.4)}
.pill .dot{width:9px;height:9px;border-radius:50%;background:var(--teal2);box-shadow:0 0 0 5px rgba(20,184,166,.2)}
h1{font-size:66px;line-height:1.06;letter-spacing:-.03em;font-weight:850;margin-bottom:22px}
h1 .grad{background:linear-gradient(120deg,var(--teal),var(--blue));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:24px;color:var(--mut);max-width:560px;line-height:1.5}
.dom{margin-top:30px;font-size:20px;font-weight:700;color:var(--teal)}
/* 右側:名片 + 掃描框 */
.right{position:relative;z-index:1;flex:none;width:360px;height:440px;display:grid;place-items:center}
.bizcard{width:320px;border-radius:20px;background:linear-gradient(160deg,#fff,#f2f6f8);padding:30px 30px 26px;box-shadow:0 40px 80px -28px rgba(15,23,42,.4);position:relative;overflow:hidden;transform:rotate(-3deg)}
.bizcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:linear-gradient(135deg,var(--teal2),var(--blue))}
.bc-logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--teal2),var(--blue));display:grid;place-items:center;margin-bottom:18px}
.bc-logo svg{width:26px;height:26px}
.bc-name{font-size:28px;font-weight:850;color:#0f1c24}
.bc-role{font-size:16px;color:#54636e;font-weight:600;margin:5px 0 18px}
.bc-line{height:1px;background:#e4ebef;margin-bottom:16px}
.bc-row{display:flex;align-items:center;gap:11px;font-size:16px;color:#3d4b55;margin-bottom:10px;font-weight:500}
.bc-row svg{width:19px;height:19px;color:var(--teal);flex:none}
.frame{position:absolute;width:300px;height:340px;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-3deg)}
.corner{position:absolute;width:34px;height:34px;border:4px solid #2dd4bf;filter:drop-shadow(0 0 6px rgba(45,212,191,.6))}
.corner.tl{top:0;left:0;border-right:0;border-bottom:0;border-radius:15px 0 0 0}
.corner.tr{top:0;right:0;border-left:0;border-bottom:0;border-radius:0 15px 0 0}
.corner.bl{bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 15px}
.corner.br{bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 15px 0}
.hint{color:var(--mut);font-size:14px;font-weight:600;max-width:1200px;text-align:center}
.hint b{color:var(--ink)}
</style>
</head>
<body>
  <div class="og" id="og">
    <span class="blob b1"></span><span class="blob b2"></span>
    <div class="left">
      <div class="brand">
        <span class="mark"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="#fff" stroke-width="1.8"/><path d="M3 9h18" stroke="#fff" stroke-width="1.8"/><circle cx="8" cy="14" r="1.7" fill="#fff"/><path d="M13 13h5M13 16h3" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg></span>
        <b>CardSnap</b>
      </div>
      <span class="pill"><span class="dot"></span>拍照即建檔的名片整理工具</span>
      <h1>名片，<span class="grad">拍一張</span><br>就好</h1>
      <p class="sub">對準名片拍一下,姓名、公司、電話自動認好,整理成能搜尋的名單;手機電腦都同步。</p>
      <div class="dom">name-car-box.com</div>
    </div>
    <div class="right">
      <div class="bizcard">
        <div class="bc-logo"><svg viewBox="0 0 24 24" fill="none"><path d="M4 13l4-4 3 3 5-6" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="bc-name">王小明</div>
        <div class="bc-role">業務經理 · 示範科技</div>
        <div class="bc-line"></div>
        <div class="bc-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.4-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>0912-345-678</div>
        <div class="bc-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 6 10 7 10-7" stroke-linecap="round"/></svg>ming@example.com</div>
      </div>
      <div class="frame"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i></div>
    </div>
  </div>
  <p class="hint">↑ 這張正好 <b>1200×630</b>。用瀏覽器「擷取節點/元素截圖」對準這張卡,存成 <b>assets/og.png</b> 即可讓分享預覽生效。</p>
</body>
</html>
